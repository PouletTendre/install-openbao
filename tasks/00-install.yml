---
- name: Installer les prérequis pour les dépôts HTTPS et GPG
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian # Requis sur Debian pour le module deb822_repository
    state: present
    update_cache: true

- name: Ajouter le dépôt officiel OpenBao (format DEB822)
  ansible.builtin.deb822_repository:
    name: openbao
    types: [deb]
    uris: "https://pkgs.openbao.org/deb/"
    suites: [stable]
    components: [main]
    signed_by: "{{ lookup('ansible.builtin.file', 'openbao.asc') }}"
    state: present
  register: openbao_repo

- name: Install openbao
  ansible.builtin.apt:
    name: openbao
    state: present
    update_cache: "{{ openbao_repo.changed }}"