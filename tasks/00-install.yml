---
- name: Install prerequisites for HTTPS and GPG repositories
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian # Required on Debian for the deb822_repository module
    state: present
    update_cache: true

- name: Add official OpenBao repository (DEB822 format)
  ansible.builtin.deb822_repository:
    name: openbao
    types: [deb]
    uris: "https://pkgs.openbao.org/deb/"
    suites: [stable]
    components: [main]
    signed_by: "{{ lookup('ansible.builtin.file', 'openbao.asc') }}"
    state: present
  register: openbao_repo

- name: Install OpenBao package
  ansible.builtin.apt:
    name: openbao
    state: present
    update_cache: "{{ openbao_repo.changed }}"

