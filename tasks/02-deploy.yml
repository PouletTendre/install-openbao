---
- name: Deploy OpenBao configuration file
  ansible.builtin.template:
    src: config.hcl.j2
    dest: "{{ openbao_config_path }}"
    owner: openbao
    group: openbao
    mode: '0640'
  notify: Restart OpenBao

- name: Start and enable OpenBao service
  ansible.builtin.systemd:
    name: openbao
    state: started
    enabled: true

