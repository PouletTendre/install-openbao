---
- name: Create Raft storage directory
  ansible.builtin.file:
    path: "{{ openbao_data_dir }}"
    state: directory
    owner: openbao
    group: openbao
    mode: '0700'

- name: Create TLS certificates directory
  ansible.builtin.file:
    path: "{{ openbao_tls_dir }}"
    state: directory
    owner: openbao
    group: openbao
    mode: '0700'

- name: Create audit logs directory
  ansible.builtin.file:
    path: "{{ openbao_log_dir }}"
    state: directory
    owner: openbao
    group: openbao
    mode: '0700'

- name: Copy public TLS certificate (fullchain)
  ansible.builtin.copy:
    src: "{{ openbao_tls_cert_src }}"
    dest: "{{ openbao_tls_dir }}/openbao.crt"
    owner: openbao
    group: openbao
    mode: '0644'
  notify: Restart OpenBao

- name: Copy private TLS key
  ansible.builtin.copy:
    src: "{{ openbao_tls_key_src }}"
    dest: "{{ openbao_tls_dir }}/openbao.key"
    owner: openbao
    group: openbao
    mode: '0600'
  no_log: true
  notify: Restart OpenBao

- name: Install Root CA into OS trust store
  ansible.builtin.copy:
    src: "{{ openbao_ca_cert_src }}"
    dest: /usr/local/share/ca-certificates/root_ca.crt
    owner: root
    group: root
    mode: '0644'
  notify: Update system CA certificates

